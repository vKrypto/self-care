apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.facebook.react'

def apkArchitectures = (project.findProperty('reactNativeArchitectures') ?: 'armeabi-v7a,arm64-v8a,x86,x86_64')
    .split(',').collect { it.trim() }.findAll { it }

react {
    autolinkLibrariesWithApp()
    // Save APK space; Android decompresses the Hermes bundle when loading it.
    enableBundleCompression = true
    // Only debug loads JavaScript from Metro. Preview and LAN APKs include their
    // bundle and Hermes bytecode, just like a release build.
    debuggableVariants = ['debug']
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion
    namespace 'com.forma.datasync'
    defaultConfig {
        applicationId 'com.forma.datasync'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 9
        versionName '0.3.6'
        buildConfigField 'boolean', 'ALLOW_LAN_HTTP', 'false'
        buildConfigField 'String', 'DEFAULT_SERVER_URL', '""'
        buildConfigField 'String', 'DEFAULT_EMAIL', '""'
        buildConfigField 'String', 'DEFAULT_PASSWORD', '""'
    }
    buildTypes {
        debug { }
        // Release APKs are unsigned until deployment signing is configured.
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        preview {
            initWith release
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
            applicationIdSuffix '.preview'
            versionNameSuffix '-preview'
            resValue 'string', 'app_name', 'Forma Data Sync Preview'
        }
        lan {
            initWith release
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
            applicationIdSuffix '.preview'
            versionNameSuffix '-lan-preview'
            buildConfigField 'boolean', 'ALLOW_LAN_HTTP', 'true'
            // User-requested local test defaults; other builds leave these blank.
            buildConfigField 'String', 'DEFAULT_SERVER_URL', '"http://192.168.100.8:8000"'
            buildConfigField 'String', 'DEFAULT_EMAIL', '"admin@example.com"'
            buildConfigField 'String', 'DEFAULT_PASSWORD', '"admin123"'
            resValue 'string', 'app_name', 'Forma Data Sync LAN Preview'
        }
    }
    splits {
        abi {
            enable true
            reset()
            include(*apkArchitectures)
            universalApk true
        }
    }
    packaging {
        jniLibs {
            // Android extracts these at installation; compressing them reduces
            // APK downloads while retaining the same native code on the device.
            useLegacyPackaging = true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'com.facebook.react:react-android'
    implementation 'com.facebook.react:hermes-android'
    implementation 'androidx.work:work-runtime-ktx:2.10.1'
    implementation 'androidx.health.connect:connect-client:1.1.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250107'
}
